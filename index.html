<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q4 Drill 1</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">

    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            background-image: url(bg.jpg);
            background-size: cover;
            color:white;
            text-align:center;}

        .box{
            background: rgba(0,0,0,0.6);
            padding:40px;
            border-radius:10px;
            margin-top:100px;}
    </style>
</head>

<body>
	<h1 class="mt-4">Electricity Consumption Classifier</h1>

<div class="container">
<div class="box">

<h2>Compute Electricity Consumption</h2>


<p>Enter your electricity consumption and we'll classify it for you.</p>

<input type="number" id="consumption" class="form-control" placeholder="Enter your electricity consumption (kWh)">

<br>

<button onclick="classifyConsumption()" class="btn btn-primary">
Classify Consumption
</button>

<br><br>

<h3 id="result"></h3>

<br>

<p>Source: 
<a href="https://www.calculator.net/electricity-calculator.html" target="_blank">
Calculator.net - Electricity Calculator
</a>
</p>
</div>
</div>
<script>

// Function that runs when the button is clicked
function classifyConsumption(){

    let consumption = document.getElementById("consumption").value;

    let classification;

    if(consumption > 500){
        classification = "Very High Consumption (Heavy Electricity Usage)";
    }
    else if (consumption > 300 && consumption <= 500){
        classification = "High Consumption (Higher Electricity Usage)";
    }
    else if (consumption > 200 && consumption <= 300){ 
        classification = "Normal Consumption (Typical Electricity Usage)";
    }
    else if (consumption > 100 && consumption <= 200){
        classification = "Low Consumption (Normal Residential Rate)";
    }
    else if (consumption >= 0 && consumption <= 100){
        classification = "Lifeline Consumption (Discounted Electricity Rate)";
    }

    alert("Classification: " + classification);
}


</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js "></script>
</body>
</html>
